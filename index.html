<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Grocery Game</title>
<style>
  /* Deliberately minimal. Just enough to be legible and thumb-reachable. */
  :root {
    --ink: #2e2a26;
    --paper: #f5f0e8;
    --line: #d8cfc2;
    --good: #3f6b46;
    --quiet: #8a7f70;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.4 system-ui, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* Top: the store. Bottom: the controls, within thumb reach. */
  .store {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 32px;
    padding: 24px;
    text-align: center;
  }

  .label {
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--quiet);
    margin-bottom: 4px;
  }

  .money { font-size: 44px; font-weight: 600; }

  .shelf {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    background: #fffdf9;
  }

  .stock { font-size: 32px; font-weight: 600; }

  .status {
    margin-top: 6px;
    font-size: 14px;
    color: var(--quiet);
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px 24px 24px;
  }

  button {
    /* Tall enough to hit with a thumb without looking. */
    min-height: 60px;
    width: 100%;
    border: 1px solid var(--ink);
    border-radius: 12px;
    background: #fffdf9;
    color: var(--ink);
    font: inherit;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
  }

  button:active { background: #ece5da; }

  /* No fail state: an unaffordable button goes quiet, it never scolds. */
  button:disabled { opacity: 0.4; cursor: default; }

  .note {
    min-height: 22px;
    text-align: center;
    font-size: 15px;
    color: var(--good);
    padding-bottom: 4px;
  }

  /* A testing tool, not part of the game. Small and out of the way. */
  .reset {
    align-self: flex-end;
    min-height: 0;
    width: auto;
    border: none;
    background: none;
    margin: 8px 16px 0 0;
    padding: 8px;
    font-size: 14px;
    font-weight: 400;
    color: var(--quiet);
    text-decoration: underline;
  }

  .reset:active { background: none; }

  .warning {
    margin: 0;
    padding: 10px 24px;
    text-align: center;
    font-size: 14px;
    color: var(--quiet);
  }
</style>
</head>
<body>

<button class="reset" id="reset">Start over</button>

<p class="warning" id="warning" hidden></p>

<main class="store">
  <div>
    <div class="label">Money</div>
    <div class="money" id="money"></div>
  </div>

  <div class="shelf">
    <div class="label">Apples</div>
    <div class="stock" id="stock"></div>
    <div class="status" id="status"></div>
  </div>
</main>

<div class="note" id="note"></div>

<div class="controls">
  <button id="restock"></button>
</div>

<script>
// One shelf, one product. The store now saves to this device.
// Still no database and no offline earnings -- the store does not run while
// closed, it is only remembered.

// ------------------------------------------------------------ up to date

// A page saved to the home screen can sit on an old copy of itself for days,
// with no reload button to fix it. So on each launch we quietly ask the server
// what the current version is, and if it has moved, reload at a slightly
// different address -- the reliable way past a cached copy.
//
// Bump VERSION on every deploy.
const VERSION = '4';

async function checkForUpdate() {
  // If we already reloaded for this version, don't do it again: that would be
  // an endless refresh loop if anything here misbehaves.
  const alreadyTried = new URLSearchParams(location.search).get('v');

  try {
    const res = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;

    const found = (await res.text()).match(/const VERSION = '([^']*)'/);
    if (!found) return;

    const latest = found[1];
    if (latest !== VERSION && latest !== alreadyTried) {
      location.replace(location.pathname + '?v=' + latest);
    }
  } catch (err) {
    // Offline, or the check failed. Play the copy we have; it is not important
    // enough to interrupt anyone over.
  }
}

// ---------------------------------------------------------------- config

const RESTOCK_COST      = 2;      // what we pay the supplier per apple
const SELL_PRICE        = 3;      // what a customer pays us per apple
const CAPACITY          = 8;      // how many apples fit on the shelf
const CUSTOMER_EVERY_MS = 15000;  // how often someone wanders in

// Placeholder pacing. A full shelf empties in two minutes, which is good for
// testing and almost certainly too fast to live with. Tune it with the user.

const SAVE_KEY     = 'grocery.save';
const SAVE_VERSION = 1;

// ---------------------------------------------------------------- state

// Everything about the store lives here. Plain data only: no functions, no DOM
// references, nothing that would not survive being turned into text and back.
function newStore() {
  return {
    money: 20,
    stock: 0,
    lastPlayed: Date.now(),  // groundwork for offline earnings; unused so far
  };
}

let state = newStore();

// Some browsers (private windows, storage turned off) throw on any storage
// access. The game still has to work; it just forgets.
let canSave = true;

// ---------------------------------------------------------------- saving

function save() {
  if (!canSave) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      version: SAVE_VERSION,
      state: state,
    }));
  } catch (err) {
    canSave = false;
    render();
  }
}

function load() {
  let raw;
  try {
    raw = localStorage.getItem(SAVE_KEY);
  } catch (err) {
    canSave = false;
    return null;
  }
  if (!raw) return null;

  let save;
  try {
    save = JSON.parse(raw);
  } catch (err) {
    return null;  // corrupted; start fresh rather than crash
  }

  return repair(migrate(save));
}

// Upgrades an old save one version at a time. When the shape of the store
// changes, bump SAVE_VERSION and add a step here -- so a store someone has been
// growing for weeks survives the change.
function migrate(save) {
  if (!save || typeof save !== 'object') return null;

  let version = save.version;
  let state = save.state;

  // Example of the shape a future step takes:
  // if (version === 1) { state.decor = []; version = 2; }

  if (version !== SAVE_VERSION) return null;  // unknown or newer than us
  return state;
}

// A saved store is just text on a device, so treat it as untrusted: anything
// missing or nonsensical falls back to a sane value instead of breaking.
function repair(state) {
  if (!state || typeof state !== 'object') return null;

  const fresh = newStore();
  const number = (value, fallback) =>
    typeof value === 'number' && isFinite(value) ? value : fallback;

  return {
    money: Math.max(0, Math.floor(number(state.money, fresh.money))),
    stock: Math.min(CAPACITY, Math.max(0, Math.floor(number(state.stock, 0)))),
    lastPlayed: number(state.lastPlayed, Date.now()),
  };
}

// ---------------------------------------------------------------- economy

// The whole game, as one pure function: given a store and how much time has
// passed, what happened? No clock, no randomness, no page -- everything comes
// in through the arguments. That is what lets the same code handle both the
// hours you were away and the seconds you are watching, and it is why this can
// be tested without a browser.
function simulate(store, elapsedMs) {
  const arrivals = Math.floor(elapsedMs / CUSTOMER_EVERY_MS);

  // Nobody buys from an empty shelf. Note what this quietly does: however long
  // you stay away, earnings are bounded by the stock you left out. That is the
  // cap on offline earnings -- the shelf itself, not a rule that cuts you off.
  const sold = Math.min(arrivals, store.stock);

  return {
    sold: sold,
    store: {
      money: store.money + sold * SELL_PRICE,
      stock: store.stock - sold,
      // Only time actually consumed by arrivals is spent; the remainder rolls
      // forward. Without this, opening the game every few seconds would keep
      // throwing away the leftover and nothing would ever sell.
      lastPlayed: store.lastPlayed + arrivals * CUSTOMER_EVERY_MS,
    },
  };
}

// Brings the store up to the present moment. Returns how many apples sold.
function advance() {
  const now = Date.now();

  // The clock moved backwards -- a timezone change, or a phone with the wrong
  // date. Don't rewind, don't accuse anyone of anything, just carry on.
  if (now < state.lastPlayed) {
    state.lastPlayed = now;
    save();
    return 0;
  }

  const result = simulate(state, now - state.lastPlayed);
  const moved = result.store.lastPlayed !== state.lastPlayed;

  state = result.store;
  if (moved) save();

  return result.sold;
}

// ---------------------------------------------------------------- actions

function canRestock() {
  return state.money >= RESTOCK_COST && state.stock < CAPACITY;
}

function restock() {
  if (!canRestock()) return;
  state.money -= RESTOCK_COST;
  state.stock += 1;
  commit('Stocked an apple.');
}

function startOver() {
  if (!confirm('Start the store over from scratch?')) return;
  state = newStore();
  commit('Fresh start.');
}

// Every change to the store goes through here, so saving can never be
// forgotten at a call site.
function commit(note) {
  state.lastPlayed = Date.now();
  save();
  render(note);
}

// ---------------------------------------------------------------- rendering

const el = {
  money:   document.getElementById('money'),
  stock:   document.getElementById('stock'),
  note:    document.getElementById('note'),
  warning: document.getElementById('warning'),
  status:  document.getElementById('status'),
  restock: document.getElementById('restock'),
  reset:   document.getElementById('reset'),
};

function statusLine() {
  if (state.stock === 0) return 'The shelf is empty.';

  const since = Math.max(0, Date.now() - state.lastPlayed);
  const seconds = Math.ceil((CUSTOMER_EVERY_MS - since) / 1000);
  return 'Next customer in ' + Math.max(0, seconds) + 's';
}

// What to say on opening the game. Never a scolding: an empty shelf is a thing
// that happened, not a mistake that was made.
function welcomeBack(sold, awayMs) {
  if (sold > 0) {
    return 'While you were away, ' + sold + (sold === 1 ? ' apple' : ' apples')
         + ' sold. +$' + sold * SELL_PRICE;
  }
  if (awayMs > 5 * 60 * 1000 && state.stock === 0) {
    return 'The shelf was empty while you were away.';
  }
  return '';
}

// Passing no note leaves the existing one alone, so a "while you were away"
// message survives the once-a-second re-render instead of blinking out.
function render(note) {
  el.money.textContent = '$' + state.money;
  el.stock.textContent = state.stock + ' / ' + CAPACITY;
  el.status.textContent = statusLine();

  el.restock.textContent = 'Restock  ·  $' + RESTOCK_COST;
  el.restock.disabled = !canRestock();

  if (typeof note === 'string') el.note.textContent = note;

  el.warning.hidden = canSave;
  el.warning.textContent = canSave
    ? ''
    : "This browser won't let the game save, so the store starts over each visit.";
}

// ---------------------------------------------------------------- start

el.restock.addEventListener('click', restock);
el.reset.addEventListener('click', startOver);

state = load() || newStore();

// Catch up on everything that happened while the game was closed, before the
// first paint -- so the store is already up to date when it appears.
const awayMs = Math.max(0, Date.now() - state.lastPlayed);
const soldWhileAway = advance();
render(welcomeBack(soldWhileAway, awayMs));

// While the game is open, the same catching-up runs once a second. Nothing is
// simulated in the background; this is only here so the shelf visibly moves
// while you watch it.
setInterval(() => {
  const sold = advance();
  render(sold > 0 ? (sold === 1 ? 'Sold an apple.' : 'Sold ' + sold + ' apples.') : undefined);
}, 1000);

checkForUpdate();
</script>

</body>
</html>
